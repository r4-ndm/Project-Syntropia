[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syntropia"
# Version comes from syntropia/__init__.py (the single source of truth) —
# the CLI and the AUR PKGBUILD read the same value.
dynamic = ["version"]
description = "Syntropia — the living computer's CLI"
requires-python = ">=3.11"
dependencies = ["click>=8.0"]

[tool.setuptools.dynamic]
version = {attr = "syntropia.__version__"}

[project.scripts]
syntropia = "syntropia.cli:main"

[tool.setuptools]
packages = ["syntropia"]
