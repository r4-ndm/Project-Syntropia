[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syntropia"
version = "0.1.0"
description = "Syntropia — the living computer's CLI"
requires-python = ">=3.11"
dependencies = ["click>=8.0"]

[project.scripts]
syntropia = "syntropia.cli:main"

[tool.setuptools]
packages = ["syntropia"]
