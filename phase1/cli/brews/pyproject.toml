[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syntropia-brews"
# Version is cosmetic for the wheel — the governed source of truth is
# syntropia/__init__.py, which all three AUR PKGBUILDs read in pkgver().
# Bump this alongside syntropia/__init__.py.
version = "0.1.0"
description = "Syntropia app helper — install Windows DAWs and VSTs via Wine + yabridge"
requires-python = ">=3.11"
# Runtime needs the syntropia core (syntropia.process / syntropia.progress);
# enforced by the AUR PKGBUILD's depends=(syntropia-cli), not by PyPI.
# textual is only used by `syntropia brews-gui` — on Arch it's the
# python-textual package (added to the AUR PKGBUILD's depends), not PyPI.
dependencies = ["click>=8.0"]

# Registers install/save/submit/plugins/... into the core `syntropia` group.
[project.entry-points."syntropia.plugins"]
brews = "syntropia_brews.cli:register"

[tool.setuptools]
packages = ["syntropia_brews"]
